# Firebase App Hosting config — production (app.elbrit.org).
# UAT overrides live in apphosting.uat.yaml; give the UAT backend the
# environment name "uat" in the Firebase console so that file is applied.
#
# NEXT_PUBLIC_* are inlined into the client bundle at build time, so they need
# BUILD availability (and a rebuild to change). Secrets are created once with
#   firebase apphosting:secrets:set <NAME>
# and are only ever exposed at RUNTIME, never baked into the bundle.
# See .env.example for what each variable does.

runConfig:
  minInstances: 0     # scale to zero when idle; set 1 to avoid cold starts (costs a small always-on fee)
  maxInstances: 10    # hard ceiling on spend if something starts looping requests
  concurrency: 80     # one instance serves many requests at once — this is the saving over Netlify
  cpu: 1
  memoryMiB: 1024

env:
  # ── Firebase web config (public) ──────────────────────────────────────────
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAU7NbYC2FizLMT0HWJLWPTR0XkEn-xBXA
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: elbrit-sso-d01d9.firebaseapp.com
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: elbrit-sso-d01d9
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: elbrit-sso-d01d9.firebasestorage.app
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "878677132537"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:878677132537:web:c85dd96936d5ed1ecd4e28
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-2REFK80W2D
  - variable: NEXT_PUBLIC_FIRESTORE_DATABASE_ID
    value: elbrit

  # ── Plasmic + release guard (scripts/release-guard.js runs in the build) ──
  # Confirm against the Netlify test-optimize site before the first deploy.
  - variable: NEXT_PUBLIC_PLASMIC_TAG
    value: prod
  - variable: RELEASE_CHANNEL
    value: prod
    availability: [BUILD]

  # ── Novu ──────────────────────────────────────────────────────────────────
  - variable: NOVU_BACKEND_URL
    value: https://api.notify.elbrit.org
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_NOVU_APPLICATION_IDENTIFIER
    value: K3rsfIP_eYvg
  - variable: NEXT_PUBLIC_NOVU_BACKEND_URL
    value: https://api.notify.elbrit.org
  - variable: NEXT_PUBLIC_NOVU_SOCKET_URL
    value: https://ws.notify.elbrit.org
  - variable: NOVU_API_KEY
    secret: NOVU_API_KEY
  - variable: NOVU_TRIGGER_SECRET
    secret: NOVU_TRIGGER_SECRET

  # ── ERP (server-side only: login-help, profile picture, print) ────────────
  # NEXT_PUBLIC_ by name only — no client code names them literally, so they
  # are not inlined. Kept RUNTIME-only so a build can never bake them in.
  - variable: ERP_TARGET
    value: ERP
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GRAPHQL_ENDPOINT_ERP
    secret: GRAPHQL_ENDPOINT_ERP
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GRAPHQL_AUTH_TOKEN_ERP
    secret: GRAPHQL_AUTH_TOKEN_ERP
    availability: [RUNTIME]

  # ── Google Calendar OAuth ─────────────────────────────────────────────────
  - variable: GOOGLE_CLIENT_ID
    value: 509894256351-70n154bekl76g0gcfanddh4nvqcqukv1.apps.googleusercontent.com
    availability: [RUNTIME]
  - variable: GOOGLE_CLIENT_SECRET
    secret: GOOGLE_CLIENT_SECRET
  - variable: APP_URL
    value: https://app.elbrit.org
    availability: [RUNTIME]
