<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Elbrit One</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The last thing the app loads on its way out. See lib/appExit.js.

  The app walks its history back to entry 0 and then REPLACES that entry with
  this page, which discards every forward entry and leaves this document as the
  only one in the session. That is the whole point: Chromium refuses
  window.close() unless the window has an opener or its history holds fewer
  than two entries, and from here it holds one.

  Everything below the script is for the case where the browser still says no.
  It stays hidden until close() has had its chance, otherwise it would flash up
  in the instant before the window disappears. The entry count is printed
  because it is the one number that says WHY: 1 means the walk worked and the
  browser refused anyway, more than 1 means the walk did not reach entry 0.
-->
<style>
  :root { color-scheme: light dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #fff;
    color: rgb(0 0 0 / 0.88);
    font: 400 15px/1.5 Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
  }
  .card { max-width: 20rem; visibility: hidden; }
  body.stuck .card { visibility: visible; }
  h1 { margin: 0 0 8px; font-size: 1.0625rem; font-weight: 600; color: rgb(23, 37, 84); }
  p { margin: 0 0 20px; font-size: 0.875rem; color: rgb(0 0 0 / 0.65); }
  a {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 10px;
    background: rgb(220, 38, 39);
    color: #fff;
    font-size: 0.875rem;
    font-weight: 600;
    text-decoration: none;
  }
  code { font-size: 0.75rem; opacity: 0.5; display: block; margin-top: 16px; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: rgb(255 255 255 / 0.88); }
    h1 { color: rgb(255 255 255 / 0.92); }
    p { color: rgb(255 255 255 / 0.6); }
  }
</style>
</head>
<body>
<script>
  try { sessionStorage.removeItem('__elbritExitInProgress'); } catch (e) {}
  var entries = history.length;
  try { window.close(); } catch (e) { /* refused — the card below takes over */ }
  setTimeout(function () {
    document.body.className = 'stuck';
    var el = document.getElementById('why');
    if (el) el.textContent = 'history entries: ' + entries;
  }, 500);
</script>
<div class="card">
  <h1>Elbrit One is closed</h1>
  <p>This browser would not close the window by itself. Swipe the app away to finish, or carry on where you left off.</p>
  <a href="/">Back to Elbrit One</a>
  <code id="why"></code>
</div>
</body>
</html>
