<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sign in — Account Audit</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --ink: #14181f; --ink-2: #5b6472; --ink-3: #8b95a4;
    --line: #e3e7ec; --accent: #1f6feb; --bad: #c0362c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --ink: #e8ecf1; --ink-2: #9aa5b3; --ink-3: #6b7583;
      --line: #262c35; --accent: #58a6ff; --bad: #ff8880;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 26px 24px;
  }
  h1 { font-size: 17px; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.sub { color: var(--ink-2); font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
  input {
    width: 100%; font: inherit; padding: 9px 11px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 25%, transparent); border-color: var(--accent); }
  button {
    width: 100%; margin-top: 14px; font: inherit; font-weight: 600; cursor: pointer;
    padding: 10px; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #fff;
  }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: var(--bad); font-size: 12.5px; margin: 12px 0 0; min-height: 1.2em; }
  .foot { color: var(--ink-3); font-size: 11.5px; margin: 18px 0 0; }
</style>
</head>
<body>
  <form class="card" id="form">
    <h1>Account Audit</h1>
    <p class="sub">Internal dashboard. Sign in to continue.</p>
    <label for="pw">Password</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus required>
    <button type="submit" id="go">Sign in</button>
    <p class="err" id="err"></p>
    <p class="foot">Session lasts 12 hours on this device.</p>
  </form>
<script>
  const $ = (s) => document.querySelector(s);
  // Only same-origin paths are honoured, so ?next= can't be used to bounce a
  // signed-in user off to another site.
  const nextParam = new URLSearchParams(location.search).get('next') || '/';
  const next = nextParam.startsWith('/') && !nextParam.startsWith('//') ? nextParam : '/';

  $('#form').onsubmit = async (e) => {
    e.preventDefault();
    $('#go').disabled = true;
    $('#err').textContent = '';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: $('#pw').value }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || `Sign-in failed (${res.status})`);
      location.replace(next);
    } catch (err) {
      $('#err').textContent = err.message;
      $('#pw').select();
    } finally {
      $('#go').disabled = false;
    }
  };
</script>
</body>
</html>
