# UAT overrides (app-uat.elbrit.org). Applied on top of apphosting.yaml when
# the backend's environment name is "uat". Only what differs from prod is here.

env:
  - variable: NEXT_PUBLIC_PLASMIC_TAG
    value: dev
  - variable: RELEASE_CHANNEL
    value: dev
    availability: [BUILD]

  # Login-help tickets must land in UAT ERP, not live ERP.
  - variable: ERP_TARGET
    value: UAT
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GRAPHQL_ENDPOINT_UAT
    secret: GRAPHQL_ENDPOINT_UAT
    availability: [RUNTIME]
  - variable: NEXT_PUBLIC_GRAPHQL_AUTH_TOKEN_UAT
    secret: GRAPHQL_AUTH_TOKEN_UAT
    availability: [RUNTIME]

  - variable: APP_URL
    value: https://app-uat.elbrit.org
    availability: [RUNTIME]
